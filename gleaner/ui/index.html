<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gleaner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 30V9' stroke='%23b07d1e' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cg fill='%23b07d1e'%3E%3Cellipse cx='16' cy='5' rx='2.4' ry='4'/%3E%3Cellipse cx='11.5' cy='11' rx='2.2' ry='3.6' transform='rotate(-35 11.5 11)'/%3E%3Cellipse cx='20.5' cy='11' rx='2.2' ry='3.6' transform='rotate(35 20.5 11)'/%3E%3Cellipse cx='11.5' cy='18' rx='2.2' ry='3.6' transform='rotate(-35 11.5 18)'/%3E%3Cellipse cx='20.5' cy='18' rx='2.2' ry='3.6' transform='rotate(35 20.5 18)'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --paper: #f5f1e8; --paper-2: #ece6d8; --ink: #1f1c17; --ink-2: #5d564a; --ink-3: #8f8676;
  --rule: #d9d1bf; --accent: #a8741a; --accent-soft: rgba(176, 125, 30, .13);
  --add: #2f6b3f; --add-soft: rgba(47, 107, 63, .11); --del: #9a3b2e; --del-soft: rgba(154, 59, 46, .10);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #17150f; --paper-2: #201d16; --ink: #ede6d6; --ink-2: #b3a991; --ink-3: #7f7766;
    --rule: #332e24; --accent: #e0b456; --accent-soft: rgba(224, 180, 86, .13);
    --add: #8fc79c; --add-soft: rgba(143, 199, 156, .10); --del: #e59a8c; --del-soft: rgba(229, 154, 140, .10);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); display: grid;
  grid-template-rows: auto 1fr; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* top bar */
header { display: flex; align-items: center; gap: 20px; padding: 14px 24px; border-bottom: 1px solid var(--rule);
  position: relative; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand h1 { font: italic 600 24px/1 var(--serif); margin: 0; letter-spacing: .01em; }
.brand span { color: var(--ink-3); font-size: 13px; }
.folders { flex: 1; display: flex; gap: 8px; align-items: center; min-width: 0; }
.folders input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid var(--rule);
  color: var(--ink); font: 13px var(--mono); padding: 6px 2px; }
.folders input:focus { outline: none; border-color: var(--accent); }
.btn { border: 1px solid var(--rule); background: transparent; border-radius: 3px; padding: 6px 14px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { opacity: .88; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 2px 9px; font-size: 12.5px; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0;
  transition: width .3s; }

/* layout */
.layout { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--rule); overflow: auto; display: flex; flex-direction: column; }
main { overflow: auto; min-width: 0; }
.tabs { display: flex; gap: 18px; padding: 14px 20px 0; border-bottom: 1px solid var(--rule); }
.tabs button { background: none; border: 0; padding: 6px 0 10px; color: var(--ink-3); border-bottom: 2px solid transparent;
  margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
.tabs b { font-weight: 500; font-variant-numeric: tabular-nums; margin-left: 4px; color: var(--ink-3); }
.list { list-style: none; margin: 0; padding: 6px 0; flex: 1; }
.list button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 20px; display: block;
  border-left: 2px solid transparent; }
.list button:hover { background: var(--paper-2); }
.list button[aria-current="true"] { background: var(--paper-2); border-left-color: var(--accent); }
.list .n { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.list .m { color: var(--ink-3); font-size: 12.5px; }
.flag { color: var(--accent); font-weight: 600; }
.aside-foot { padding: 12px 20px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 12.5px; }
.aside-foot button { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--ink-2); }

/* family view */
.page { max-width: 900px; margin: 0 auto; padding: 36px 40px 80px; }
.page h2 { font: italic 600 30px/1.15 var(--serif); margin: 0 0 6px; overflow-wrap: anywhere; }
.lead { color: var(--ink-2); margin: 0 0 4px; }
.lead code, .path { font: 12.5px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
section { margin-top: 38px; }
section > h3 { font: 600 11.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between;
  align-items: center; gap: 12px; }
section > h3 .btn { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-2); }

/* lineage */
.lineage { position: relative; }
.lineage svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: start; min-height: 64px;
  padding: 10px 10px 10px 0; border-radius: 3px; cursor: pointer; }
.row:hover { background: var(--paper-2); }
.row.sel { background: var(--accent-soft); }
.row .t { font-variant-numeric: tabular-nums; }
.row .v { font: italic 600 16px var(--serif); margin-right: 8px; }
.row .files { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 1px; }
.row .side { color: var(--ink-3); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-left: 8px; }
.delta-add { color: var(--add); } .delta-del { color: var(--del); }
.row .acts { display: none; gap: 6px; margin-top: 4px; }
.row:hover .acts, .row.sel .acts, .row:focus-within .acts { display: flex; }

/* strays */
.stray { padding: 16px 18px; background: var(--accent-soft); border-radius: 3px; margin-bottom: 12px; }
.stray p { margin: 0 0 10px; font: 16px/1.55 var(--serif); white-space: pre-wrap; }
.stray .from { color: var(--ink-2); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.stray .after { color: var(--ink-3); font-style: italic; }
.removed .stray { background: var(--paper-2); }
.removed .stray p { color: var(--ink-2); font-size: 15px; }
details summary { cursor: pointer; color: var(--ink-2); padding: 4px 0; }
.ok { font: italic 16px/1.5 var(--serif); color: var(--ink-2); margin: 0; }

/* diff */
.diffhead { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; color: var(--ink-2); flex-wrap: wrap; }
.diffhead select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 6px; max-width: 280px; }
.diff p { margin: 0; padding: 6px 12px; font: 15px/1.55 var(--serif); white-space: pre-wrap; border-left: 2px solid transparent; }
.diff .same { color: var(--ink-3); }
.diff .add { background: var(--add-soft); border-color: var(--add); }
.diff .del { background: var(--del-soft); border-color: var(--del); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--del) 50%, transparent); }
.diff .mod { border-color: var(--ink-3); }
.diff ins { background: var(--add-soft); color: var(--add); text-decoration: none; }
.diff del { background: var(--del-soft); color: var(--del); }
.diff .skip { font: 12.5px var(--sans); color: var(--ink-3); padding: 10px 12px; letter-spacing: .04em; }

/* empty and status */
.empty { height: 100%; display: grid; place-items: center; text-align: center; padding: 40px; }
.empty div { max-width: 460px; }
.empty h2 { font: italic 600 28px/1.2 var(--serif); margin: 18px 0 10px; }
.empty p { color: var(--ink-2); margin: 0 0 8px; }
.empty .glyph { color: var(--accent); }
.problems { font-size: 12.5px; color: var(--ink-2); padding: 0 20px 12px; }
.problems li { overflow-wrap: anywhere; margin-bottom: 4px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper);
  padding: 8px 16px; border-radius: 3px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.err { color: var(--del); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; } aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--rule); }
  header { flex-wrap: wrap; } .page { padding: 24px 18px 60px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Gleaner</h1><span data-t="tagline"></span></div>
  <form class="folders" id="scanform">
    <label class="sr" for="roots" data-t="folders"></label>
    <input id="roots" spellcheck="false" autocomplete="off">
    <button class="btn primary" id="scanbtn" data-t="scan"></button>
  </form>
  <div class="progress" id="progress"></div>
</header>
<div class="layout">
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-mine" aria-selected="true"><span data-t="mine"></span><b id="c-mine">0</b></button>
      <button role="tab" id="tab-recv" aria-selected="false"><span data-t="received"></span><b id="c-recv">0</b></button>
    </div>
    <ul class="list" id="list"></ul>
    <div class="aside-foot" id="foot"></div>
    <ul class="problems" id="problems" hidden></ul>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const T = {
  en: {
    tagline: "every version of your documents, and what was left behind", folders: "Folders to read, separated by ;",
    scan: "Read", scanning: "Reading…", mine: "Your documents", received: "Received",
    versions: n => `${n} version${n > 1 ? "s" : ""}`, files: n => `${n} file${n > 1 ? "s" : ""}`,
    strandedN: n => `${n} passage${n > 1 ? "s" : ""} left behind`,
    readN: (n, s) => `${n} documents read in ${s} s`, unreadable: n => `${n} unreadable`,
    latest: "Latest version", modified: "edited", lineage: "Lineage",
    lineageHelp: "Each version descends from the older one it most resembles. Click one to compare it with its parent.",
    left: "Left behind", leftHelp: "Written in another copy, never carried into the latest version.",
    copyAll: "Copy all", copy: "Copy", open: "Show file", inV: v => `in v${v}`, after: "belongs after",
    atStart: "belongs at the start", removed: n => `${n} passage${n > 1 ? "s" : ""} deleted along the way`,
    removedHelp: "These existed on the latest version's own line and were deleted there: probably on purpose.",
    allIn: "Nothing was left behind: everything written in the other copies is in the latest version, or was deleted on purpose along the way.",
    compare: "Compare", with: "with", diffSame: "These two versions have the same text.", skip: n => `${n} unchanged paragraphs`,
    makeHead: "Treat as latest", copied: "Copied", added: "added", deleted: "deleted",
    emptyTitle: "Find the versions of your documents", emptyText: "Gleaner reads your Word, PowerPoint, LibreOffice, PDF and text files, groups the copies of each document, and shows which one is the latest and what an older copy holds that the latest lost.",
    emptyLocal: "Everything stays on this computer. Nothing is modified.",
    noFam: "No document exists in several versions in these folders.", pick: "Pick a document on the left.",
    readingTitle: "Reading your documents…", noRecv: "PDF-only families: documents you most likely received rather than wrote.",
    from: "from", words: "words", time_file: "file date", time_document: "date saved in the document",
    copies: "copies", missing: "Folder not found:", sameN: n => `${n} identical copies`, paths: "Paths below are relative to"
  },
  fr: {
    tagline: "toutes les versions de vos documents, et ce qui est resté en chemin", folders: "Dossiers à lire, séparés par ;",
    scan: "Lire", scanning: "Lecture…", mine: "Vos documents", received: "Reçus",
    versions: n => `${n} version${n > 1 ? "s" : ""}`, files: n => `${n} fichier${n > 1 ? "s" : ""}`,
    strandedN: n => `${n} passage${n > 1 ? "s" : ""} resté${n > 1 ? "s" : ""} en chemin`,
    readN: (n, s) => `${n} documents lus en ${s} s`, unreadable: n => `${n} illisible${n > 1 ? "s" : ""}`,
    latest: "Dernière version", modified: "modifiée le", lineage: "Filiation",
    lineageHelp: "Chaque version descend de la version plus ancienne qui lui ressemble le plus. Cliquez-en une pour la comparer à sa mère.",
    left: "Restés en chemin", leftHelp: "Écrits dans une autre copie, jamais reportés dans la dernière version.",
    copyAll: "Tout copier", copy: "Copier", open: "Afficher le fichier", inV: v => `dans la v${v}`, after: "à replacer après",
    atStart: "à replacer au début", removed: n => `${n} passage${n > 1 ? "s" : ""} supprimé${n > 1 ? "s" : ""} en cours de route`,
    removedHelp: "Ils existaient sur la lignée même de la dernière version et y ont été supprimés : sans doute volontairement.",
    allIn: "Rien n'est resté en chemin : tout ce qui a été écrit dans les autres copies est dans la dernière version, ou a été supprimé volontairement en cours de route.",
    compare: "Comparer", with: "avec", diffSame: "Ces deux versions ont le même texte.", skip: n => `${n} paragraphes inchangés`,
    makeHead: "Considérer comme la dernière", copied: "Copié", added: "ajoutés", deleted: "supprimés",
    emptyTitle: "Retrouvez les versions de vos documents", emptyText: "Gleaner lit vos fichiers Word, PowerPoint, LibreOffice, PDF et texte, regroupe les copies de chaque document, et montre laquelle est la dernière et ce qu'une ancienne copie contient que la dernière a perdu.",
    emptyLocal: "Tout reste sur cet ordinateur. Rien n'est modifié.",
    noFam: "Aucun document n'existe en plusieurs versions dans ces dossiers.", pick: "Choisissez un document à gauche.",
    readingTitle: "Lecture de vos documents…", noRecv: "Familles uniquement en PDF : sans doute des documents reçus plutôt qu'écrits.",
    from: "issue de", words: "mots", time_file: "date du fichier", time_document: "date enregistrée dans le document",
    copies: "copies", missing: "Dossier introuvable :", sameN: n => `${n} copies identiques`, paths: "Chemins ci-dessous relatifs à"
  }
};
const L = T[(navigator.language || "en").slice(0, 2)] || T.en;
document.documentElement.lang = L === T.fr ? "fr" : "en";
document.querySelectorAll("[data-t]").forEach(el => el.textContent = L[el.dataset.t]);
document.getElementById("roots").placeholder = L.folders;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const base = p => p.split(/[\\/]/).pop();
const dir = p => p.slice(0, p.length - base(p).length);
const fmt = t => new Date(t * 1000).toLocaleString(document.documentElement.lang, {dateStyle: "medium", timeStyle: "short"});
const api = (path, body) => fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {})
  .then(async r => { const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error), j); return j; });

let S = null, tab = "mine", current = null, family = null, compareA = null, compareB = null, rootsTyped = false;

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1600); }
function copy(text) { navigator.clipboard.writeText(text).then(() => toast(L.copied)); }

async function poll() {
  try { S = await api("/api/state"); } catch { setTimeout(poll, 2000); return; }
  if (!rootsTyped) $("roots").value = S.roots.join(" ; ");
  $("scanbtn").disabled = S.scanning;
  $("scanbtn").textContent = S.scanning ? L.scanning : L.scan;
  const [n, total] = S.progress;
  $("progress").style.width = S.scanning && total ? (100 * n / total) + "%" : "0";
  renderList();
  if (S.scanning) { if (!family) renderEmpty(true); setTimeout(poll, 400); return; }
  const m = location.hash.match(/^#f=(\d+)$/);  // a reload or a bookmark reopens the same document
  if (!family && m && +m[1] < S.families.length) { tab = S.families[+m[1]].received ? "recv" : "mine"; openFamily(+m[1]); }
  else if (!family) renderEmpty(false);
}

function renderList() {
  const mine = S.families.filter(f => !f.received), recv = S.families.filter(f => f.received);
  $("c-mine").textContent = mine.length; $("c-recv").textContent = recv.length;
  $("tab-mine").setAttribute("aria-selected", tab === "mine"); $("tab-recv").setAttribute("aria-selected", tab === "recv");
  const items = tab === "mine" ? mine : recv;
  $("list").innerHTML = items.map(f => `<li><button data-i="${f.i}" ${f.i === current ? 'aria-current="true"' : ""}>
    <span class="n">${esc(f.name)}</span>
    <span class="m">${f.versions > 1 ? `${L.versions(f.versions)} · ${L.files(f.files)}` : L.sameN(f.files)}${f.stranded ? ` · <span class="flag">${L.strandedN(f.stranded)}</span>` : ""}</span>
  </button></li>`).join("") || (S.finished && tab === "recv" ? `<li class="aside-foot">${L.noRecv}</li>` : "");
  const probs = S.problems.length;
  $("foot").innerHTML = S.finished ? `${L.readN(S.documents, S.took)}${probs ? ` · <button id="showprobs">${L.unreadable(probs)}</button>` : ""}` : "";
  if (probs) $("showprobs").onclick = () => { const p = $("problems"); p.hidden = !p.hidden;
    p.innerHTML = S.problems.map(x => `<li><span class="path">${esc(x.path)}</span> — ${esc(x.reason)}</li>`).join(""); };
}

function renderEmpty(scanning) {
  const has = S && S.families.length;
  $("main").innerHTML = `<div class="empty"><div>
    <svg class="glyph" width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 30V9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><g fill="currentColor"><ellipse cx="16" cy="5" rx="2.4" ry="4"/><ellipse cx="11.5" cy="11" rx="2.2" ry="3.6" transform="rotate(-35 11.5 11)"/><ellipse cx="20.5" cy="11" rx="2.2" ry="3.6" transform="rotate(35 20.5 11)"/><ellipse cx="11.5" cy="18" rx="2.2" ry="3.6" transform="rotate(-35 11.5 18)"/><ellipse cx="20.5" cy="18" rx="2.2" ry="3.6" transform="rotate(35 20.5 18)"/></g></svg>
    <h2>${scanning ? L.readingTitle : has ? L.pick : S && S.finished ? L.noFam : L.emptyTitle}</h2>
    ${S && S.error ? `<p class="err">${esc(S.error)}</p>` : ""}
    ${!has ? `<p>${L.emptyText}</p>` : ""}<p>${L.emptyLocal}</p></div></div>`;
}

async function openFamily(i, head) {
  current = i;
  history.replaceState(null, "", `#f=${i}`);
  renderList();
  family = await api(`/api/family?i=${i}${head != null ? `&head=${head}` : ""}`);
  const h = family.versions[family.head];
  compareB = h.n; compareA = h.parent ?? h.n;
  renderFamily();
  diff();
}

function lineageSVG(vs, ys, height) {
  // the latest version's own line is the left rail; side copies branch off to the right
  const line = new Set(); let x = family.head;
  while (x != null) { line.add(x); x = vs[x].parent; }
  const col = {}, used = {}; let next = 1;
  for (const v of vs) {
    if (line.has(v.n)) { col[v.n] = 0; continue; }
    const pc = v.parent != null ? col[v.parent] : 0;
    if (pc > 0 && !used[v.parent]) { col[v.n] = pc; used[v.parent] = true; } else col[v.n] = next++;
  }
  const y = ys;
  const X = c => 12 + c * 18, w = X(next) + 6;
  let s = "";
  for (const v of vs) if (v.parent != null) {
    const x1 = X(col[v.parent]), y1 = y[v.parent], x2 = X(col[v.n]), y2 = y[v.n];
    const d = x1 === x2 ? `M${x1} ${y1}V${y2}` : `M${x1} ${y1}C${x1} ${y1 - 30} ${x2} ${y2 + 30} ${x2} ${y2}`;
    s += `<path d="${d}" fill="none" stroke="${line.has(v.n) ? "var(--ink-2)" : "var(--ink-3)"}" stroke-width="1.3" ${line.has(v.n) ? "" : 'stroke-dasharray="3 3"'}/>`;
  }
  for (const v of vs) {
    const strayed = family.stranded.some(st => st.source === v.n);
    s += v.is_head ? `<circle cx="${X(col[v.n])}" cy="${y[v.n]}" r="6" fill="var(--accent)"/>`
      : `<circle cx="${X(col[v.n])}" cy="${y[v.n]}" r="4.5" fill="var(--paper)" stroke="${strayed ? "var(--accent)" : "var(--ink-2)"}" stroke-width="1.5"/>`;
  }
  return {svg: `<svg width="${w}" height="${height}" aria-hidden="true">${s}</svg>`, w};
}

function commonDir(paths) {
  let p = dir(paths[0]);
  while (p && !paths.every(x => x.startsWith(p))) p = dir(p.slice(0, -1));
  return p;
}

function renderFamily() {
  const f = family, vs = f.versions, head = vs[f.head];
  const root = commonDir(vs.flatMap(v => v.files.map(x => x.path)));
  const strayCount = n => f.stranded.filter(s => s.source === n).length;
  const rows = [...vs].reverse().map(v => {
    const p = v.parent != null ? vs[v.parent] : null;
    const d = p ? v.words - p.words : null;
    return `<div class="row ${v.n === compareB ? "sel" : ""}" data-n="${v.n}" tabindex="0">
      <div><span class="v">v${v.n + 1}</span><span class="t">${fmt(v.time)}</span>${v.is_head ? `<span class="tag">${L.latest}</span>` : ""}${strayCount(v.n) ? `<span class="tag">${L.strandedN(strayCount(v.n))}</span>` : ""}</div>
      <div class="side">${v.words} ${L.words}${d ? ` · <span class="${d > 0 ? "delta-add" : "delta-del"}">${d > 0 ? "+" : "−"}${Math.abs(d)}</span>` : ""}${p ? ` · ${L.from} v${p.n + 1}` : ""}</div>
      <div class="files">${v.files.map(x => `<span class="path" title="${esc(x.path)}">${esc(x.path.slice(root.length))}</span>`).join("")}</div>
      <div class="acts">${!v.is_head ? `<button class="btn small" data-head="${v.files[0].id}">${L.makeHead}</button>` : ""}<button class="btn small" data-reveal="${v.files[0].id}">${L.open}</button></div>
    </div>`;
  }).join("");
  const strays = f.stranded.map((s, k) => `<div class="stray"><p>${esc(s.text)}</p><div class="from">
      <span>${L.inV(s.source + 1)} · ${esc(base(vs[s.source].files[0].path))}</span>
      <span class="after">${s.after ? `${L.after} « ${esc(s.after.length > 90 ? s.after.slice(0, 89) + "…" : s.after)} »` : L.atStart}</span>
      <button class="btn small" data-copy="${k}">${L.copy}</button>
      <button class="btn small" data-reveal="${vs[s.source].files[0].id}">${L.open}</button></div></div>`).join("");
  const removed = f.removed.map(s => `<div class="stray"><p>${esc(s.text)}</p><div class="from"><span>${L.inV(s.source + 1)}</span></div></div>`).join("");
  const options = sel => vs.map(v => `<option value="${v.n}" ${v.n === sel ? "selected" : ""}>v${v.n + 1} · ${esc(base(v.files[0].path))}</option>`).join("");
  $("main").innerHTML = `<div class="page">
    <h2>${esc(f.name)}</h2>
    <p class="lead">${L.latest} · ${L.modified} ${fmt(head.doc_time)} <span style="color:var(--ink-3)">(${L["time_" + head.time_source]})</span></p>
    <p class="lead"><code>${esc(head.files[0].path)}</code></p>
    <p class="lead" style="color:var(--ink-3)">${L.paths} <code>${esc(root)}</code></p>
    ${f.stranded.length ? `<section><h3><span>${L.left} · ${f.stranded.length}</span><button class="btn small" id="copyall">${L.copyAll}</button></h3>
      <p class="lead" style="margin-bottom:14px">${L.leftHelp}</p>${strays}</section>`
      : `<section><h3>${L.left}</h3><p class="ok">${L.allIn}</p></section>`}
    <section><h3>${L.lineage} · ${L.versions(vs.length)}</h3><p class="lead" style="margin-bottom:12px">${L.lineageHelp}</p>
      <div class="lineage" id="lineage">${rows}</div></section>
    <section><h3>${L.compare}</h3>
      <div class="diffhead"><select id="ca" aria-label="A">${options(compareA)}</select> → <select id="cb" aria-label="B">${options(compareB)}</select></div>
      <div class="diff" id="diff"></div></section>
    ${f.removed.length ? `<section class="removed"><details><summary>${L.removed(f.removed.length)}</summary>
      <p class="lead" style="margin:8px 0 14px">${L.removedHelp}</p>${removed}</details></section>` : ""}
  </div>`;
  // rails are drawn once the rows have their real heights
  const lin = $("lineage"), rowEls = [...lin.querySelectorAll(".row")];
  const cols = lineageSVG(vs, {}, 0).w;  // first pass: how wide the rails are
  rowEls.forEach(r => r.style.paddingLeft = (cols + 12) + "px");
  const ys = {}; rowEls.forEach(r => ys[+r.dataset.n] = r.offsetTop + 22);
  lin.insertAdjacentHTML("afterbegin", lineageSVG(vs, ys, lin.offsetHeight).svg);
  $("ca").onchange = e => { compareA = +e.target.value; diff(); };
  $("cb").onchange = e => { compareB = +e.target.value; markSel(); diff(); };
  if ($("copyall")) $("copyall").onclick = () => copy(f.stranded.map(s => s.text).join("\n\n"));
}

function markSel() { document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", +r.dataset.n === compareB)); }

async function diff() {
  const box = $("diff"); if (!box) return;
  const a = family.versions[compareA].files[0].id, b = family.versions[compareB].files[0].id;
  if (compareA === compareB) { box.innerHTML = `<p class="ok">${L.diffSame}</p>`; return; }
  const {blocks} = await api(`/api/diff?a=${a}&b=${b}`);
  if (!blocks.some(x => x.t !== "same" && x.t !== "skip")) { box.innerHTML = `<p class="ok">${L.diffSame}</p>`; return; }
  box.innerHTML = blocks.map(x => x.t === "skip" ? `<p class="skip">··· ${L.skip(x.n)}</p>`
    : x.t === "mod" ? `<p class="mod">${x.words.map(([o, s]) => o === "=" ? esc(s) : o === "+" ? `<ins>${esc(s)}</ins>` : `<del>${esc(s)}</del>`).join("")}</p>`
    : `<p class="${x.t}">${esc(x.text)}</p>`).join("");
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, .row");
  if (!t) return;
  if (t.matches(".list button")) return openFamily(+t.dataset.i);
  if (t.dataset.copy != null) return copy(family.stranded[+t.dataset.copy].text);
  if (t.dataset.reveal != null) return api("/api/reveal", {id: +t.dataset.reveal});
  if (t.dataset.head != null) return openFamily(current, +t.dataset.head);
  if (t.id === "tab-mine" || t.id === "tab-recv") { tab = t.id === "tab-mine" ? "mine" : "recv"; return renderList(); }
  if (t.classList.contains("row")) {
    const v = family.versions[+t.dataset.n];
    compareB = v.n; compareA = v.parent ?? v.n;
    $("ca").value = compareA; $("cb").value = compareB; markSel(); diff();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("row")) e.target.click();
});
$("roots").addEventListener("input", () => rootsTyped = true);
$("scanform").onsubmit = async e => {
  e.preventDefault();
  const roots = $("roots").value.split(";").map(s => s.trim()).filter(Boolean);
  try { await api("/api/scan", {roots}); } catch (err) { toast(err.folders ? `${L.missing} ${err.folders.join(", ")}` : err.message); return; }
  family = null; current = null; poll();
};
poll();
</script>
</body>
</html>
