name: release
# Pushing a tag like v0.1.0 builds Gleaner.exe on a clean Windows machine, checks it, and
# publishes it with the Python package on the GitHub release page.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[dev]" pyinstaller build
      - run: pytest -q
      - name: Build Gleaner.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Gleaner --paths . --add-data "gleaner/ui;gleaner/ui" --hidden-import pypdf --hidden-import gleaner.__main__ packaging/gleaner_app.py
      - name: Check the exe reads documents
        shell: pwsh
        run: |
          python demo/make_demo.py demo-out
          $p = Start-Process dist/Gleaner.exe -ArgumentList "demo-out --no-browser --port 7399 --quit-when-idle 0.5" -PassThru
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; try { $s = Invoke-RestMethod http://127.0.0.1:7399/api/state; if ($s.finished) { break } } catch {} }
          $f = Invoke-RestMethod "http://127.0.0.1:7399/api/family?i=0"
          if ($f.stranded.Count -ne 2) { throw "exe check failed" }
          Stop-Process $p.Id
      - run: python -m build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/Gleaner.exe dist/*.whl dist/*.tar.gz --title "Gleaner ${{ github.ref_name }}" --notes-file packaging/RELEASE_NOTES.md
